name: FPL Weekly Summary

on:
  schedule:
    # Run every hour during the time gameweeks usually finish (e.g. 05:00 to 12:00 UTC)
    # Or just run every 2 hours all year round to keep it simple.
    - cron: "0 */2 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-fpl-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push last_reported_gw.txt back to repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run FPL Summary Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fpl_summary.py
        
      - name: Commit state file (last_reported_gw.txt)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update last reported GW state"
          file_pattern: "last_reported_gw.txt"
